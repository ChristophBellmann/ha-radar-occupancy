sample:
  fields:
    room: &room
      required: true
      selector:
        text:
    x: &coord
      required: true
      selector:
        number:
          min: -100000
          max: 100000
          mode: box
          unit_of_measurement: mm
    y: *coord
undo_sample:
  fields:
    room: *room
sample_area:
  fields:
    room: *room
    sample:
      required: true
      selector:
        number:
          min: 1
          max: 12
          mode: box
    area:
      required: true
      selector:
        select:
          options:
            - room
            - sub_area
set_location:
  fields:
    room: *room
    x: *coord
    y: *coord
set_orientation:
  fields:
    room: *room
    heading:
      selector:
        number:
          min: 0
          max: 360
          step: 0.5
          unit_of_measurement: °
    mirrored:
      selector:
        boolean:
    mount:
      selector:
        select:
          options:
            - wall
            - ceiling
    height:
      selector:
        number:
          min: 1500
          max: 5000
          step: 50
          unit_of_measurement: mm
    clear:
      selector:
        boolean:
set_boundary:
  fields:
    room: *room
    points:
      required: true
      selector:
        object:
    kind:
      selector:
        select:
          options:
            - room
            - approach
reset_calibration:
  fields:
    room: *room
set_calibration:
  fields:
    room: *room
    calibration:
      required: true
      selector:
        object:
set_exit:
  fields:
    room: *room
    x:
      selector:
        number:
          min: -100000
          max: 100000
          mode: box
          unit_of_measurement: mm
    y:
      selector:
        number:
          min: -100000
          max: 100000
          mode: box
          unit_of_measurement: mm
    clear:
      selector:
        boolean:
set_door:
  fields:
    room: *room
    to:
      example: outside
      selector:
        text:
    x:
      selector:
        number:
          min: -100000
          max: 100000
          mode: box
          unit_of_measurement: mm
    y:
      selector:
        number:
          min: -100000
          max: 100000
          mode: box
          unit_of_measurement: mm
    clear:
      selector:
        boolean:
set_floor:
  fields:
    camera:
      required: true
      selector:
        entity:
          domain: camera
    name:
      selector:
        text:
    flip:
      selector:
        boolean:
refresh_maps:
release:
  fields:
    room: *room

simulate:
  name: Simulate a walk
  description: Replay map positions with virtual lights. Actual sensors, lights and stored occupancy are unchanged. Returns a timeline and intended commands.
  fields:
    room:
      description: Room entry ID or occupancy entity. Without a route, simulates entering and sitting still.
      selector:
        text:
    route:
      description: List of waypoints with room, map x/y in mm and seconds (0.5–120). Omit room for radar dropout. Maximum 30 waypoints.
      selector:
        object:
    held:
      description: Start with one virtual held occupant in each mapped room.
      selector:
        boolean:
    ignore_restrictions:
      description: Ignore darkness and time windows in this simulation only.
      selector:
        boolean:
start_simulation:
  name: Start animated simulation
  description: Animate up to eight people on the map. Real light control is optional; restores previous light states when stopped. Real radar inputs and occupancy are unchanged.
  fields:
    persons:
      required: false
      description: List of people with unique id and route. Each waypoint has room, map x/y in mm and seconds. Positions interpolate between waypoints. Omit room for a radar dropout.
      selector:
        object:
    automatic:
      description: Generate independent walks through mapped rooms and known doorways.
      selector:
        boolean:
    count:
      description: Number of independently walking people (1–8).
      selector:
        number:
          min: 1
          max: 8
          mode: box
    duration:
      description: Automatic walk duration in seconds (30–900).
      selector:
        number:
          min: 30
          max: 900
          mode: box
    room:
      description: Preferred starting room for the first person; other people are spread across available map components.
      selector:
        text:
    seed:
      description: Optional number for repeatable automatic routes with the same maps.
      selector:
        number:
          min: 0
          max: 2147483647
          mode: box
    live_lights:
      description: Take over mapped lights during the test. Light automation must be enabled. Stop restores the previous light states.
      selector:
        boolean:
    ignore_restrictions:
      description: Ignore darkness and time windows only for the simulation.
      selector:
        boolean:
    sensor_interval: &sensor_interval
      description: Seconds between two reports of a radar (ESPHome sends LD2450 coordinates about once a second). 0 reports at every step.
      default: 1
      selector:
        number:
          min: 0
          max: 5
          step: 0.05
          mode: box
    field_of_view: &field_of_view
      description: A radar only sees people in its field of view, its own room and on the threshold of its doors. Off sees everybody everywhere, like earlier versions.
      default: true
      selector:
        boolean:
    see_through_doors: &see_through_doors
      description: A radar also sees beyond its doors along a line of sight through the open doorway. Off is the cautious bound (closed or angled doors).
      default: true
      selector:
        boolean:
measure_simulation:
  name: Measure a simulated walk
  description: Run the same walks as the animated simulation at once on a virtual clock and return when each light was decided after somebody really entered its room (`latency`, seconds; negative means before entering). Virtual lights only; real sensors, lights and stored occupancy are unchanged.
  fields:
    persons:
      required: false
      description: List of people with unique id and route, as for the animated simulation.
      selector:
        object:
    automatic:
      description: Generate independent walks through mapped rooms and known doorways.
      selector:
        boolean:
    count:
      description: Number of independently walking people (1–8).
      selector:
        number:
          min: 1
          max: 8
          mode: box
    duration:
      description: Automatic walk duration in seconds (30–900).
      selector:
        number:
          min: 30
          max: 900
          mode: box
    room:
      description: Preferred starting room for the first person.
      selector:
        text:
    seed:
      description: Optional number for repeatable automatic routes with the same maps.
      selector:
        number:
          min: 0
          max: 2147483647
          mode: box
    ignore_restrictions:
      description: Ignore darkness and time windows only for the simulation.
      selector:
        boolean:
    sensor_interval: *sensor_interval
    field_of_view: *field_of_view
    see_through_doors: *see_through_doors
stop_simulation:
  name: Stop animated simulation
  description: Stop animation and restore light states if real light control was enabled.
