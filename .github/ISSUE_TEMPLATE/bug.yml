name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Radar Occupancy and Home Assistant version.
      placeholder: "Radar Occupancy 0.3.0, Home Assistant 2026.9.1"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Distance rule
        - Map mode on a robot vacuum map
        - Map mode on a floor plan
  - type: textarea
    id: sensors
    attributes:
      label: Radar sensors and mounting
      description: Model, wall or ceiling, firmware/ESPHome version.
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Attach the diagnostics of the home and the affected room entry (Settings → Devices & services → Radar Occupancy → ⋮ → Download diagnostics).
